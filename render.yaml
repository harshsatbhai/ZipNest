# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploys the ZipNest download website as a free static site.
# Installers are NOT hosted here; they live on GitHub Releases.
services:
  - type: web
    runtime: static
    name: zipnest
    branch: main
    autoDeploy: true
    buildCommand: echo "Static site, no build step"
    staticPublishPath: ./website
    pullRequestPreviewsEnabled: false
    buildFilter:
      paths:
        - website/**
        - render.yaml
    headers:
      # ---- Security headers (all pages) ----
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://api.github.com; font-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: same-origin
      # ---- Caching ----
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /*.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /config.js
        name: Cache-Control
        value: public, max-age=300
